# PR checks. `summary` is the one required check (vantage-terraform's ruleset): it keeps one comment
# on the PR up to date with what each job found and how the PR changes the amount of code
# (scripts/ci_report.py), and fails when a job it needs failed or was cancelled. The seed has its
# own workflow (seed.yaml), which builds on a pull request that changes it.
name: checks

on:
  pull_request:

permissions: {}

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz actionlint
          ./actionlint -color
      - name: shellcheck
        run: shellcheck ingress.sh seed/*.sh web/team/e2e/*.sh
      # docs/parity.md and the About screen's table match docs/todo.md and docs/parity-map.yaml,
      # every nodo source file is mapped to a section, and every todo.md status is a known one.
      - name: parity
        run: /usr/bin/python3 -I scripts/parity.py --check

  # The app's scenario tests, headless against in-memory copies of the tables, in the released
  # server image (1.14.7 is the first that loads memory sessions).
  scenarios:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # The image runs as its own user: the report folder must be writable by it.
      - name: vantage-server test
        run: |
          mkdir -m 777 "$RUNNER_TEMP/report"
          docker run --rm -v "$PWD:/app:ro" -v "$RUNNER_TEMP/report:/out" \
            romaninsh/vantage-server:1.16.4 test /app --strict --junit /out/junit.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scenarios
          path: ${{ runner.temp }}/report/junit.xml
          if-no-files-found: ignore

  # The web version type-checks and builds.
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web/team
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/team/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Asset sizes
        run: find dist/assets -type f -printf '%f %s\n' > "$RUNNER_TEMP/web-sizes.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: ${{ runner.temp }}/web-sizes.txt

  # The UI gallery (web/team/gallery): every story runs as a test in Chromium (its interactions and
  # an axe check), then each is photographed at 375, 768 and 1280 px and compared with
  # web/team/playwright/snapshots. Inside the Playwright image, so fonts render the same each run.
  gallery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web/team
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: npm ci
      - name: Stories (interactions and axe)
        run: npx vitest run --project gallery --reporter=default --reporter=junit --outputFile.junit=test-results/gallery-stories.xml
      - run: npm run build-storybook
      - name: Visual snapshots
        id: visual
        env:
          CI: "true"
        run: npx playwright test -c playwright/gallery.config.ts
      # A fresh set of snapshots to download and commit when the pixels moved on purpose.
      - name: Fresh snapshots
        if: failure() && steps.visual.outcome == 'failure'
        run: npx playwright test -c playwright/gallery.config.ts --update-snapshots=all --reporter=dot --output "$RUNNER_TEMP/fresh" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.visual.outcome == 'failure'
        with:
          name: gallery-snapshots
          path: web/team/playwright/snapshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gallery
          path: |
            web/team/test-results/gallery-stories.xml
            web/team/test-results/gallery-visual.xml
            web/team/test-results/gallery
          if-no-files-found: ignore

  # The web app end to end on the real stack: this PR's seed in the Postgres service on 5434 (the
  # port datasource/*.yaml name), vantage-server and the built app, started by
  # web/team/e2e/stack.sh. Playwright signs in as Marc Demo and changes his to-dos.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: odoo
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: web/team
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # The committed master seed (seed/master, rebuilt by hand with seed/refresh.sh) into Odoo's
      # usual `odoo`, the database the datasources read, with this PR's NOTIFY triggers. No Odoo
      # install in CI.
      - name: Load the seed
        run: |
          pg() { docker run --rm --network host -e PGPASSWORD=odoo \
            -v "$GITHUB_WORKSPACE/seed:/src:ro" postgres:17 "$@"; }
          pg pg_restore -h 127.0.0.1 -p 5434 -U odoo -d odoo --exit-on-error /src/master/nodo.dump
          pg psql -h 127.0.0.1 -p 5434 -U odoo -d odoo -v ON_ERROR_STOP=1 -q -f /src/notify.sql
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/team/package-lock.json
      - run: npm ci
      - run: npm run build
      # Chromium is cached per lockfile (its Playwright version); only its system packages are
      # installed on a hit.
      - name: Restore Playwright's browser
        id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('web/team/package-lock.json') }}
      - name: Install Playwright's browser
        run: |
          if [ "${{ steps.browsers.outputs.cache-hit }}" = true ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: Save Playwright's browser
        if: steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.cache-primary-key }}
      # The vantage-server image stack.sh runs, cached as a saved image per tag instead of pulled
      # from Docker Hub on every run.
      - name: Server image tag
        id: server
        run: echo "image=$(grep -o 'romaninsh/vantage-server:[0-9.]*' e2e/stack.sh | head -1)" >> "$GITHUB_OUTPUT"
      - name: Restore the server image
        id: server-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/images
          key: docker-${{ steps.server.outputs.image }}
      - name: Load or pull the server image
        env:
          IMAGE: ${{ steps.server.outputs.image }}
        run: |
          mkdir -p "$RUNNER_TEMP/images"
          if [ -f "$RUNNER_TEMP/images/server.tar" ]; then
            docker load -q -i "$RUNNER_TEMP/images/server.tar"
          else
            docker pull -q "$IMAGE" && docker save -o "$RUNNER_TEMP/images/server.tar" "$IMAGE"
          fi
      - name: Save the server image
        if: steps.server-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/images
          key: ${{ steps.server-cache.outputs.cache-primary-key }}
      - name: Start the stack
        env:
          DB_IMAGE: running
        run: e2e/stack.sh up
      - name: End-to-end tests
        id: e2e
        env:
          CI: "true"
        run: npm run test:e2e
      - name: Server logs
        if: failure()
        run: e2e/stack.sh logs
      # A fresh set of phone pictures, on a fresh stack, to download and commit when the pixels
      # moved on purpose.
      - name: Fresh snapshots
        if: failure() && steps.e2e.outcome == 'failure'
        run: |
          e2e/stack.sh up
          npx playwright test -c playwright/e2e.config.ts --project phone --update-snapshots=all --reporter=dot --output "$RUNNER_TEMP/fresh" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.e2e.outcome == 'failure'
        with:
          name: e2e-snapshots
          path: web/team/e2e/snapshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e
          path: |
            web/team/test-results/e2e.xml
            web/team/test-results/e2e
          if-no-files-found: ignore

  summary:
    needs: [workflows, scenarios, web, gallery, e2e]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # the summary comment
    steps:
      # Full history: the code counts compare this PR with its base.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/results
      # A broken report never fails the check; a failed job always does.
      - name: Report
        continue-on-error: true
        env:
          JOBS: ${{ toJSON(needs) }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTS: ${{ runner.temp }}/results
        run: |
          python3 -I scripts/ci_report.py --jobs "$JOBS" --base "$BASE" --run "$RUN_URL" \
            --junit "$RESULTS/scenarios/junit.xml" --web "$RESULTS/web/web-sizes.txt" \
            --stories "$RESULTS/gallery/gallery-stories.xml" --visual "$RESULTS/gallery/gallery-visual.xml" \
            --e2e "$RESULTS/e2e/e2e.xml" > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      # One comment per PR, found by its marker and edited, never a new one per run.
      - name: PR comment
        if: hashFiles('summary.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            -q '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- nodo-ci-report -->"))) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@summary.md > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@summary.md > /dev/null
          fi
      - name: Every needed job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
