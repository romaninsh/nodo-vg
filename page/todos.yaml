# yaml-language-server: $schema=./page-schema-1.json
title: To-do list
body:
  - kind: row
    justify: between
    align: center
    children:
      - kind: label
        params:
          text: "${session.name}'s to-dos"
          style: heading
          icon: ListChecks
      - kind: button
        params:
          label: New
          icon: Plus
          style: primary
          action: |
            let f = actions.todo_new_form();
            let r = actions.todo_create(f);
            toast("Added to your Inbox", "success");
            open_in("sheet", "todo", #{ id: r.id });

  - kind: grid
    name: todos
    observe: todo_view
    params:
      search: true
      default_sort: { column: date_deadline, direction: asc }
      on_select: 'open_in("sheet", "todo", #{ id: row.id })'
      columns:
        priority:
          label: Priority
          width: 80
          labels: { "0": Low, "1": Medium, "2": High, "3": Urgent }
          color: { muted: ["0"], warning: ["1", "2"], danger: ["3"] }
        name: { label: To-do, width: 300 }
        date_deadline: { label: Deadline, render: relative, width: 130 }
        due:
          label: Due
          width: 90
          labels: { overdue: Overdue, today: Today, soon: This week, later: Later }
          color: { danger: [overdue], warning: [today], muted: [soon, later] }
        tags: { label: Tags, width: 200 }
        assignees: { label: Assigned to, width: 220 }
        state:
          label: Status
          width: 100
          labels: { 01_in_progress: To do, 02_changes_requested: Changes requested, 03_approved: Approved, 04_waiting_normal: Waiting, 1_done: Done, 1_canceled: Cancelled }
          color: { success: [1_done], muted: [1_canceled], default: [01_in_progress] }
      quick_filters:
        chips:
          # As in Odoo: not done or cancelled, and not in one of your folded columns (Done, Cancelled).
          - { label: Open, script: 'table.where("open_for", "like", "," + session.uid + ",")', default: true }
          - { label: Active, script: 'table.where("active", true)', default: true }
          - { label: Starred, dot: yellow, script: 'table.where("priority", "in", ["1", "2", "3"])' }
          - { label: Overdue, dot: red, script: 'table.where("due", "overdue")' }
          - { label: Done, dot: green, script: 'table.where("state", "1_done")' }
          - { label: Archived, script: 'table.where("active", false)' }
