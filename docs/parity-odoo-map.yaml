# The Odoo half of docs/parity-map.yaml: which of Odoo 20's files serve each section of
# docs/todo.md's feature inventory, and what share of each file does. Paths are relative to
# odoo/addons. Only app code To-do uses: the project_todo addon and the parts of project, mail
# and mail_tracking it relies on. Not counted: the ORM, the generic web client (kanban, list and
# calendar views, many2many_tags, priority, statusbar), and project-only features (milestones,
# dependencies, recurrence, sharing, portal, ratings). mail files are shared by every Odoo app;
# their shares are the parts a To-do user sees. Shares are estimates from reading the methods,
# views and templates named in `why`.

