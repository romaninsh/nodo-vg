# yaml-language-server: $schema=./datasource-schema-1.json
description: Odoo's own database. nodo writes rows the way Odoo does and never changes its structure. Each person sees only their own to-dos, assignments and stages.
type: postgres
url: postgresql://odoo:odoo@localhost:5434/odoo
# The tables nodo shows have NOTIFY triggers (seed/notify.sql), so pages and the web version
# update as soon as anyone writes, nodo or Odoo, with no refresh timers.
notify: true
invariants:
  # Assignments (project_task_user_rel) and personal stages (project_task_type) carry the
  # person in `user_id`: everyone sees and changes only their own.
  user_id:
    script: |
      table.where("user_id", session.uid);
      if table_name == "todo_user" || table_name == "card" {
        // Assignments of to-dos only (no project tasks). Archived ones stay yours, as in Odoo;
        // the board leaves them out itself (table/card.yaml).
        table.with_condition(sql::expr("task_id IN (SELECT id FROM project_task WHERE project_id IS NULL AND parent_id IS NULL AND is_template IS NOT TRUE)"));
      }
      // New assignments come only from the to-do actions (todo_create, todo_set_assignees),
      // which run under the exceptions below; anything else could assign itself someone
      // else's to-do.
      table.before_insert(|record| throw "Assignments are made by adding or assigning a to-do");
      table.before_update(|record, stored| if record.user_id != session.uid || stored.user_id != session.uid { throw "You can only change your own rows" });
      table.before_delete(|id, row| if row.user_id != session.uid { throw "You can only remove your own rows" });
    exceptions:
      # Assigning a to-do to colleagues writes their assignment rows; the action checks the
      # to-do is yours first.
      - { type: action, name: todo_set_assignees, when: 'session.uid != ()' }
      # Creating a to-do assigns it to the caller (and reads the caller's first column).
      - { type: action, name: todo_create, when: 'session.uid != ()' }
      # Adding a column inserts a row the rule refuses; the action stamps it as the caller's.
      - { type: action, name: stage_create, when: 'session.uid != ()' }
      - { type: action, name: stage_defaults, when: 'session.uid != ()' }
      # Deleting a column first moves the caller's assignments out of it, project tasks
      # included (hidden by this rule, but they block the delete); the action keeps to the
      # caller's own rows.
      - { type: action, name: stage_delete, when: 'session.uid != ()' }
  # A to-do's chatter and followers (todo_message, todo_follower): only on to-dos assigned to you. The other tables that
  # point at a record by `res_id` (followers, messages and activities for writing) are reached
  # only from the to-do actions, which check the to-do is yours first.
  res_id:
    script: |
      if table_name == "todo_message" || table_name == "todo_follower" {
        table.with_condition(sql::expr("res_id IN (SELECT task_id FROM project_task_user_rel WHERE user_id = {})", [session.uid]));
      }
  # To-dos (project_task): tasks with no project, no parent, not a template, that are assigned
  # to you, archived or not (as Odoo's rule; lists leave archived ones out themselves).
  project_id:
    script: |
      if table_name == "todo" {
        // `"is", null()` would read better for the two NULL checks, but the project validator
        // refuses `null` in rule scripts (FEEDBACK.md); the loaded rule accepts it.
        table.where("mine", true).where("is_template", "is_not", true);
        table.with_condition(sql::expr("project_id IS NULL AND parent_id IS NULL"));
        table.before_insert(|record| if record.project_id != () { throw "A to-do belongs to no project" });
        table.before_update(|record, stored| if record.project_id != () { throw "A to-do belongs to no project" });
      } else {
        // The read-only to-do views (todo_view and the lists over it) select to-dos only.
        table.with_condition(sql::expr("id IN (SELECT task_id FROM project_task_user_rel WHERE user_id = {})", [session.uid]));
      }
    exceptions:
      # A new to-do isn't assigned to anyone until the same action adds its assignment, so the
      # insert can't pass the "assigned to you" check. The action stamps project_id = () and
      # assigns it to the caller in one transaction.
      - { type: action, name: todo_create, when: 'session.uid != ()' }
      # Vantage's write check for this rule fails on any timestamp change ("invalid byte
      # sequence for encoding UTF8: 0x00", see FEEDBACK.md). These actions check that the
      # to-do is a to-do assigned to the caller before they write.
      - { type: action, name: todo_save, when: 'session.uid != ()' }
      - { type: action, name: todo_toggle_done, when: 'session.uid != ()' }
      - { type: action, name: todo_set_priority, when: 'session.uid != ()' }
      - { type: action, name: todo_set_assignees, when: 'session.uid != ()' }
      - { type: action, name: todo_archive, when: 'session.uid != ()' }
      - { type: action, name: todo_delete, when: 'session.uid != ()' }
      # This rule's SQL condition can't run in scenario tests (the in-memory copies don't
      # evaluate SQL; gaps spec TEST-1), so the tag action checks the to-do is the caller's
      # itself, like the actions above, and its tests run.
      - { type: action, name: todo_set_tags, when: 'session.uid != ()' }
      - { type: action, name: todo_duplicate, when: 'session.uid != ()' }
      - { type: action, name: todo_log_note, when: 'session.uid != ()' }
      - { type: action, name: todo_follow, when: 'session.uid != ()' }
      - { type: action, name: todo_unfollow, when: 'session.uid != ()' }
