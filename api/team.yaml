# yaml-language-server: $schema=./api-schema-1.json
# The team's web version: people sign in with their Odoo login and see only their own to-dos
# (the datasource rules apply here as on the desktop). Every change goes through an action.
title: nodo for the team
description: To-do and CRM for the team, signed in with Odoo logins.
entities:
  - name: todos
    observe: todo_view
    read_only: true
    params:
      columns: [name, priority, date_deadline, state, active, tags, tag_ids, assignees, assignee_ids, due, notes, description, summary, write_date, open_for]
      filter: [id, name, state, active, priority, due, open_for]
      default_sort: date_deadline
    # A computed view: it listens to the Odoo tables it reads (table/todo_view.yaml), so
    # changes from nodo and Odoo arrive as they happen.
    api: { load: instant }
  - name: cards
    observe: todo_user
    read_only: true
    params:
      columns: [task_id, stage_id, task.name, task.priority, task.date_deadline, task.state, task.tags, task.tag_ids, task.assignees, task.due, task.summary]
      filter: [task_id, stage_id]
    api: { load: instant }
  - name: stages
    observe: stage
    read_only: true
    params:
      columns: [name, sequence, fold]
      default_sort: sequence
    api: { load: instant }
  - name: tags
    observe: tag
    read_only: true
    params:
      columns: [name, color]
      default_sort: name
    api: { load: instant }
  - name: people
    observe: person
    read_only: true
    params:
      columns: [name]
      default_sort: name
    api: { load: instant }

  # CRM. The pipeline reads every card it shows in one query (filtered by salesperson, active,
  # stage, team) and groups them into columns in the browser. The datasource rule keeps each
  # person to the opportunities Odoo lets them see. CRM entities load when a CRM page first
  # reads them (the default, lazy), so signing in to To-do doesn't read them.
  - name: opportunities
    observe: opportunity
    read_only: true
    params:
      columns: [name, active, stage_id, user_id, user_name, team_id, team_name, partner_id, customer, contact_name, partner_name, email_from, phone, expected_revenue, probability, automated_probability, priority, tag_ids, won_status, lost_reason_id, lost_reason, date_deadline, date_closed, notes, description, activity_state, activity_icon, activity_summary, rotting_days, campaign, medium, source, referred, create_date, write_date, company_id, company_name, currency_symbol, currency_position, currency_decimals]
      filter: [id, name, active, stage_id, user_id, team_id, won_status, rotting_days, activity_state, search_text, switch_teams]
      default_sort: { column: priority, direction: desc }
  - name: crm_stages
    observe: crm_stage
    read_only: true
    params:
      columns: [name, sequence, is_won, fold, rotting_threshold_days, requirements, team_ids]
      default_sort: sequence
  - name: crm_tags
    observe: crm_tag
    read_only: true
    params:
      columns: [name, color]
      default_sort: name
  - name: lost_reasons
    observe: crm_lost_reason
    read_only: true
    params:
      columns: [name]
  - name: sales_teams
    observe: sales_team
    read_only: true
    params:
      columns: [name, sequence, leader_id, member_ids]
      default_sort: sequence
  - name: customers
    observe: customer
    read_only: true
    params:
      columns: [name, email, phone, is_company]
      default_sort: name
  # The signed-in person's own CRM rights (the datasource rule shows only their row): which
  # teams they're in, whether they may delete, their company's currency.
  - name: my_crm
    observe: sales_right
    read_only: true
    params:
      columns: [salesman, all_docs, manager, company_ids, company_id, team_ids, currency_symbol, currency_position, currency_decimals]
  - name: companies
    observe: company
    read_only: true
    params:
      columns: [name]
      default_sort: name

  # Project. The overview reads every project card in one query; a project's board reads its
  # cards in one query (filtered by project) and its stages, and groups them in the browser.
  # The datasource rules apply Odoo's project and task visibility. Lazy, like CRM.
  - name: projects
    observe: project
    read_only: true
    params:
      columns: [name, sequence, active, color, partner_id, customer, user_id, manager, date_start, date, label_tasks, open_task_count, task_count, closed_task_count, tag_ids, favorite_ids, last_update_status, privacy_visibility, allow_milestones, milestone_count, milestone_reached, milestone_late, milestone_doable, allow_billable, alias_email, show_ratings, rating_avg, rating_count, allow_timesheets, allocated_hours, remaining_hours, activity_state, activity_icon, activity_summary, write_date]
      filter: [id, name, active, user_id]
      default_sort: sequence
  - name: task_stages
    observe: task_stage
    read_only: true
    params:
      columns: [name, sequence, fold, project_ids, mails_customer, asks_rating]
      filter: [id, project_ids]
      default_sort: sequence
  - name: tasks
    observe: task
    read_only: true
    params:
      columns: [name, project_id, project_name, stage_id, state, priority, sequence, active, color, date_deadline, partner_id, customer, allow_billable, allow_milestones, milestone_id, milestone, milestone_late, tag_ids, assignee_ids, assignees, allow_timesheets, allocated_hours, effective_hours, subtask_effective_hours, remaining_hours, progress, parent_id, parent_name, display_in_project, subtask_count, closed_subtask_count, depend_on_ids, depend_on_count, closed_depend_on_count, rating_active, rating_avg, rating_count, recurring_task, activity_state, activity_icon, activity_summary, description, write_date]
      filter: [id, name, project_id, stage_id, state, active, display_in_project, parent_id]
  - name: milestones
    observe: milestone
    read_only: true
    params:
      columns: [name, project_id, deadline, is_reached, sequence]
      filter: [project_id]
  # The signed-in person's own Project rights (the datasource rule shows only their row).
  - name: my_project
    observe: project_right
    read_only: true
    params:
      columns: [user, manager]

actions:
  - project_task_move
  - project_task_save
  - project_task_create
  - project_task_archive
  - project_toggle_favorite
  - project_set_status
  - sign_in
  - sign_out
  - whoami
  - todo_create
  - todo_save
  - todo_move
  - todo_toggle_done
  - todo_set_priority
  - todo_set_tags
  - todo_set_description
  - todo_set_assignees
  - todo_archive
  - crm_create
  - crm_move
  - crm_won
  - crm_lost
  - crm_restore
  - crm_save
  - crm_automated_probability
  - crm_odoo_write
  - crm_archive
  - crm_duplicate
  - crm_delete
  - crm_tag_color

auth:
  local:
    session:
      sign_in: [sign_in]
