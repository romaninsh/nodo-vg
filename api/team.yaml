# yaml-language-server: $schema=./api-schema-1.json
# The team's web version: people sign in with their Odoo login and see only their own to-dos
# (the datasource rules apply here as on the desktop). Every change goes through an action.
title: nodo for the team
description: To-do for the team, signed in with Odoo logins.
entities:
  # My to-dos that aren't archived, sent whole at connect and kept current: the list.
  - name: todos
    observe: todo_open
    read_only: true
    params:
      columns: [name, priority, date_deadline, state, active, tags, tag_ids, my_stage, sequence, assignees, assignee_ids, due, notes, summary, write_date, open_for, search_text]
      filter: [name, state, priority, due, open_for, search_text]
      default_sort: date_deadline
    # Computed views listen to the Odoo tables they read, so changes from nodo and Odoo
    # arrive as they happen.
    api: { load: instant }
  # My archived to-dos: usually most of them, so read only when asked, a page at a time.
  - name: archived
    observe: todo_archived
    read_only: true
    params:
      columns: [name, priority, date_deadline, state, active, tags, tag_ids, assignees, assignee_ids, due, write_date, search_text]
      filter: [name, search_text]
      default_sort: write_date
    api: { load: lazy, collection_limit: 200 }
  # One to-do by id, archived or not: the to-do page. No lists.
  - name: todo
    observe: todo_view
    read_only: true
    params:
      columns: [name, priority, date_deadline, state, active, tags, tag_ids, assignees, assignee_ids, due, notes, summary, write_date]
    api: { list: false }
  - name: cards
    observe: card
    read_only: true
    params:
      columns: [task_id, stage_id, name, priority, sequence, color, activity_state, date_deadline, state, tags, tag_ids, assignees, due, summary]
      filter: [task_id, stage_id]
    api: { load: instant }
  - name: stages
    observe: stage_open
    read_only: true
    params:
      columns: [name_local, sequence, fold]
      default_sort: sequence
    api: { load: instant }
  - name: tags
    observe: tag
    read_only: true
    params:
      columns: [name_local, color]
      default_sort: name_local
    api: { load: instant }
  # A to-do's chatter, asked for by to-do (res_id), newest first.
  - name: messages
    observe: todo_message
    read_only: true
    params:
      columns: [res_id, date, author, kind, text]
      filter: [res_id]
      default_sort: date
    api: { load: lazy, collection_limit: 200 }
  # A to-do's followers, asked for by to-do (res_id).
  - name: followers
    observe: todo_follower
    read_only: true
    params:
      columns: [res_id, partner_id, name]
      filter: [res_id]
      default_sort: name
    api: { load: lazy, collection_limit: 200 }
  # A to-do's planned activities, asked for by to-do (res_id), soonest first.
  - name: activities
    observe: todo_activity
    read_only: true
    params:
      columns: [res_id, type, icon_kind, summary, note, date_deadline, state, assignee_id, assignee]
      filter: [res_id]
      default_sort: date_deadline
    api: { load: lazy, collection_limit: 200 }
  - name: activity_types
    observe: activity_type
    read_only: true
    params:
      columns: [name, delay_count, sequence]
      default_sort: sequence
    api: { load: instant }
  - name: people
    observe: person
    read_only: true
    params:
      columns: [name]
      default_sort: name
    api: { load: instant }

actions:
  - sign_in
  - sign_out
  - whoami
  - todo_create
  - todo_quick_add
  - todo_save
  - todo_move
  - todo_toggle_done
  - todo_set_priority
  - todo_set_tags
  - todo_set_assignees
  - todo_archive
  - todo_duplicate
  - todo_set_color
  - todo_delete
  - todo_log_note
  - todo_follow
  - todo_unfollow
  - todo_schedule_activity
  - todo_activity_done
  - todo_activity_cancel
  - stage_create
  - stage_defaults
  - stage_rename
  - stage_fold
  - stage_delete
  - stage_reorder
  - tag_create
  - tag_set_color

auth:
  local:
    session:
      sign_in: [sign_in]
