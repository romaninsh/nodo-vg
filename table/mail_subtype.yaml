# yaml-language-server: $schema=./table-schema-1.json
# Odoo's message subtypes by their record name ("mt_note", "mt_comment"), so a logged note gets
# the database's own "Note" subtype id, which differs between databases.
datasource: odoo
title: Message subtype
id_column: xmlid
columns:
  xmlid: { type: string, flags: [id] }
  subtype_id: { type: int }
postgres:
  rhai: |
    sql::select().from("ir_model_data")
        .expression(sql::expr("name").alias("xmlid"))
        .expression(sql::expr("res_id").alias("subtype_id"))
        .where(sql::expr("model = 'mail.message.subtype' AND ((module = 'mail' AND name IN ('mt_note', 'mt_comment', 'mt_activities')) OR (module = 'project' AND name = 'mt_task_done'))"))
