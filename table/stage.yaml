# yaml-language-server: $schema=./table-schema-1.json
# Personal to-do stages (project_task_type rows owned by a user). Odoo keeps the name as JSON
# keyed by language; nodo shows the reader's language, falling back to English.
# The datasource rule narrows it to the signed-in person's stages, archived or not;
# table/stage_open.yaml leaves the archived ones out.
datasource: odoo
table: project_task_type
title: Stage
id_column: id
columns:
  id: { type: int, flags: [id, auto] }
  name: { type: json, flags: [hidden] }                     # every language
  name_en: { type: string, label: English, nested_path: name.en_US }
  name_local:
    type: string
    label: Stage
    flags: [title]
    expr: 'sql::coalesce(table.column("name_localised"), table.column("name_en"))'
  user_id: { type: int, flags: [hidden] }
  sequence: { type: int, label: Order }
  fold: { type: bool, label: Folded }
  active: { type: bool, flags: [hidden] }
  # Written when a column is added (action/stage_create.yaml), as Odoo fills them.
  rating_status: { type: string, flags: [hidden] }
  rating_status_period: { type: string, flags: [hidden] }
  rotting_threshold_days: { type: int, flags: [hidden] }
  auto_validation_state: { type: bool, flags: [hidden] }
  create_uid: { type: int, flags: [hidden] }
  write_uid: { type: int, flags: [hidden] }
  create_date: { type: timestamp, flags: [hidden] }
  write_date: { type: timestamp, flags: [hidden] }
build: |
  table.nested_column("name_localised", "name", session.lang, #{ label: "Translation" });
postgres:
  listen: [project_task_type]
