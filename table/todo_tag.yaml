# yaml-language-server: $schema=./table-schema-1.json
# Odoo's tag links (project_tags_project_task_rel): only the pair, which is the primary key. The
# id is computed from it (`<to-do>:<tag>`), so nodo adds no column to Odoo's table.
# Reach it through a to-do's `tags`, which narrows every read and write to that to-do:
#   table("todo").where("id", t).ref("tags").insert(#{ project_tags_id: g })
# The pair is Odoo's primary key, so insert only tags the to-do doesn't have yet.
datasource: odoo
table: project_tags_project_task_rel
title: Tag link
deny: { actions: [delete_all] }
columns:
  id: { type: string, flags: [id], expr: 'sql::concat([sql::ident("project_task_id"), ":", sql::ident("project_tags_id")])' }
  project_task_id: { type: int, label: To-do }
  project_tags_id: { type: int, label: Tag }
