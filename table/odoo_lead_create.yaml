# yaml-language-server: $schema=./table-schema-1.json
# Insert-only: each row is one `crm.lead.create` call through Odoo's JSON-RPC, as the person
# whose login and password it carries. Odoo's create fills a dozen derived fields (team,
# company, probability from its scoring, contact details from the customer, followers, the
# "Opportunity Created" message), so nodo lets Odoo create and reads the new row back.
# `vals` is the map of fields to create with, built by the crm_create action: a field left out
# gets Odoo's default, which an empty value sent here would override.
datasource: odoo_rpc
title: Odoo opportunity create
columns:
  id: { type: string, flags: [id] }
  uid: { type: int }
  password: { type: string }
  vals: {}
api:
  read: false
  endpoint: /jsonrpc
  insert:
    method: POST
    body: |
      #{
        jsonrpc: "2.0",
        method: "call",
        id: 1,
        params: #{
          service: "object",
          method: "execute_kw",
          args: ["odoo", record.uid, record.password, "crm.lead", "create", [record.vals]]
        }
      }
