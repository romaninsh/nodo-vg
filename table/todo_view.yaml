# yaml-language-server: $schema=./table-schema-1.json
# To-dos with everything a list or a card shows: tag names, who it's assigned to, overdue.
# Read-only; edits go through `todo` and the to-do actions.
datasource: odoo
title: To-do
id_column: id
columns:
  id: { type: int, flags: [id] }
  name: { type: string, label: Title, flags: [title, searchable] }
  # Odoo's four levels: "0" Low, "1" Medium, "2" High, "3" Urgent (pages label them).
  priority: { type: string, label: Priority, enum: ["0", "1", "2", "3"] }
  date_deadline: { type: timestamp, label: Deadline, time_precision: minutes }
  state: { type: string, label: Status }
  active: { type: bool, label: Active }
  project_id: { type: int, flags: [hidden] }
  tags: { type: string, label: Tags }
  tag_ids: { type: string, label: Tag ids }
  assignees: { type: string, label: Assigned to }
  assignee_ids: { type: string, label: Assignee ids }
  overdue: { type: bool, label: Overdue }
  due: { type: string, label: Due, enum: [overdue, today, soon, later] }
  notes: { type: string, label: Description }
  summary: { type: string, label: Summary }
  write_date: { type: timestamp, label: Last updated }
  # Who still has it open, as ",2,7,": not done or cancelled, and not sitting in that person's
  # folded column (Done, Cancelled). "Open" filters on the signed-in person's id in here.
  open_for: { type: string, label: Open for }
postgres:
  listen: [project_task, project_task_user_rel, project_tags_project_task_rel, project_tags, project_task_type, res_users, res_partner]
  rhai: |
    sql::select().from("project_task")
        .field("id")
        .field("name")
        .expression(sql::expr("coalesce(priority, '0')").alias("priority"))
        .field("date_deadline")
        .field("state")
        .expression(sql::expr("coalesce(active, true)").alias("active"))
        .field("project_id")
        .expression(sql::expr("(SELECT string_agg(coalesce(g.name->>'en_US', ''), ', ' ORDER BY g.name->>'en_US') FROM project_tags_project_task_rel tr JOIN project_tags g ON g.id = tr.project_tags_id WHERE tr.project_task_id = project_task.id)").alias("tags"))
        .expression(sql::expr("(SELECT string_agg(tr.project_tags_id::text, ',' ORDER BY tr.project_tags_id) FROM project_tags_project_task_rel tr WHERE tr.project_task_id = project_task.id)").alias("tag_ids"))
        .expression(sql::expr("(SELECT string_agg(p.name, ', ' ORDER BY p.name) FROM project_task_user_rel ur JOIN res_users u ON u.id = ur.user_id JOIN res_partner p ON p.id = u.partner_id WHERE ur.task_id = project_task.id)").alias("assignees"))
        .expression(sql::expr("(SELECT string_agg(ur.user_id::text, ',' ORDER BY ur.user_id) FROM project_task_user_rel ur WHERE ur.task_id = project_task.id)").alias("assignee_ids"))
        .expression(sql::expr("(date_deadline IS NOT NULL AND date_deadline < (now() AT TIME ZONE 'UTC') AND state NOT IN ('1_done', '1_canceled'))").alias("overdue"))
        .expression(sql::expr("CASE WHEN date_deadline IS NULL OR state IN ('1_done', '1_canceled') THEN NULL WHEN date_deadline < (now() AT TIME ZONE 'UTC') THEN 'overdue' WHEN date_deadline::date = (now() AT TIME ZONE 'UTC')::date THEN 'today' WHEN date_deadline < (now() AT TIME ZONE 'UTC') + interval '7 days' THEN 'soon' ELSE 'later' END").alias("due"))
        .expression(sql::expr("btrim(replace(replace(replace(replace(replace(left(trim(regexp_replace(regexp_replace(coalesce(description, ''), '<(br|/p|/li|/div)[^>]*>', E'\\n', 'gi'), '<[^>]*>', '', 'g')), 2000), '&lt;', '<'), '&gt;', '>'), '&nbsp;', ' '), '&quot;', '\"'), '&amp;', '&'), E' \\n')").alias("notes"))
        .expression(sql::expr("nullif(left(trim(regexp_replace(regexp_replace(replace(replace(coalesce(description, ''), '&nbsp;', ' '), '&amp;', '&'), '<[^>]*>', ' ', 'g'), '\\s+', ' ', 'g')), 120), '')").alias("summary"))
        .field("write_date")
        .expression(sql::expr("CASE WHEN state IN ('1_done', '1_canceled') THEN ',' ELSE ',' || coalesce((SELECT string_agg(ur.user_id::text, ',' ORDER BY ur.user_id) FROM project_task_user_rel ur LEFT JOIN project_task_type s ON s.id = ur.stage_id WHERE ur.task_id = project_task.id AND s.fold IS NOT TRUE), '') || ',' END").alias("open_for"))
        .where(sql::expr("project_id IS NULL AND parent_id IS NULL AND is_template IS NOT TRUE"))
