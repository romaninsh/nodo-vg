# yaml-language-server: $schema=./table-schema-1.json
# Insert-only: each row is one `project.task.write` call through Odoo's JSON-RPC, as the
# person whose login and password it carries. Odoo answers 200 even when it refuses, so the
# caller reads the result back from the database.
datasource: odoo_rpc
title: Odoo task write
columns:
  id: { type: string, flags: [id] }
  uid: { type: int }
  password: { type: string }
  task_id: { type: int }
  tag_ids: { type: string }
api:
  read: false
  endpoint: /jsonrpc
  insert:
    method: POST
    body: |
      #{
        jsonrpc: "2.0",
        method: "call",
        id: 1,
        params: #{
          service: "object",
          method: "execute_kw",
          args: [
            "odoo", record.uid, record.password, "project.task", "write",
            [[record.task_id], #{ tag_ids: [[6, 0, record.tag_ids.split(",").filter(|x| x != "").map(|x| parse_int(x))]] }]
          ]
        }
      }
