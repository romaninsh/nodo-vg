# yaml-language-server: $schema=./table-schema-1.json
# Insert-only: each row is one `project.task.write` call through Odoo's JSON-RPC, as the
# person whose login and password it carries. Used for what Vantage can't write itself (the
# tag link table) and for what Odoo must check on the way in: the description, an HTML field
# that Odoo's write cleans (`html_sanitize`). `vals` is the map of fields to write, built by
# the calling action. Odoo answers 200 even when it refuses, so the caller reads the result
# back from the database.
datasource: odoo_rpc
title: Odoo task write
columns:
  id: { type: string, flags: [id] }
  uid: { type: int }
  password: { type: string }
  task_id: { type: int }
  vals: {}
api:
  read: false
  endpoint: /jsonrpc
  insert:
    method: POST
    body: |
      #{
        jsonrpc: "2.0",
        method: "call",
        id: 1,
        params: #{
          service: "object",
          method: "execute_kw",
          args: ["odoo", record.uid, record.password, "project.task", "write", [[record.task_id], record.vals]]
        }
      }
