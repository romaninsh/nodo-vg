# yaml-language-server: $schema=./action-schema-1.json
# Mark an activity on one of my to-dos done (Odoo's "Mark Done"). Args: activity, feedback.
# As Odoo does: a "<type> done" message by me goes on the to-do's chatter with Odoo's
# Activities subtype, then the activity is archived with today's date, kept as history.
kind: script
label: Mark done
icon: Check
atomic: true
params:
  activity: { type: int }
  feedback: { type: string, required: false }
body: |
  import "todo" as t;
  let me = session.uid;
  let a = table("todo_activity").get(parse_int(args.activity.to_string()));
  if a == () || !t::assigned(table("todo_view").get(a.res_id), me) { fail("That activity isn't on one of your to-dos"); }
  let esc = |s| { let x = s; x.replace("&", "&amp;"); x.replace("<", "&lt;"); x.replace(">", "&gt;"); x };
  let feedback = if args.feedback == () { "" } else { args.feedback.to_string() };
  feedback.trim();
  let body = "<p>" + esc.call(a.type + " done") + (if a.summary == () { "" } else { ": " + esc.call(a.summary) }) + "</p>";
  if feedback != "" { body += "<p>" + esc.call(feedback) + "</p>"; }
  let sub = table("mail_subtype").get("mt_activities");
  let p = table("person").get(me);
  table("message").insert(#{
    model: "project.task", res_id: a.res_id, message_type: "notification",
    subtype_id: if sub == () { () } else { sub.subtype_id }, mail_activity_type_id: a.type_id,
    author_id: if p == () { () } else { p.partner_id }, body: body, is_internal: false,
    date: now(), create_uid: me, write_uid: me, create_date: now(), write_date: now(),
  });
  table("activity_write").record(a.id).set(#{
    active: false, date_done: now().to_string().sub_string(0, 10),
    feedback: if feedback == "" { () } else { feedback }, write_uid: me, write_date: now(),
  }).flash();
  #{ id: a.id }
