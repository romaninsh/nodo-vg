# yaml-language-server: $schema=./action-schema-1.json
# Delete one of my columns (Odoo's Delete). Args: id.
# Everything in it moves to the column before it (the one after, for my first column), then the
# row goes. "Everything" includes my project tasks, which nodo doesn't show: Odoo's personal
# columns hold them too, and the database refuses to delete a column anything still sits in.
# So this runs under the `user_id` rule's exception and keeps to my own rows itself.
kind: script
label: Delete column
icon: Trash2
atomic: true
params:
  id: { type: int }
body: |
  let me = session.uid;
  let id = parse_int(args.id.to_string());
  let s = table("stage").get(id);
  if s == () || s.user_id != me { fail("That column isn't yours"); }
  let open = table("stage_open").where("user_id", me).sort("sequence", "asc").list();
  let at = -1;
  for i in 0..open.len() { if open[i].id == id { at = i; } }
  let others = open.filter(|c| c.id != id);
  if others.len() == 0 { fail("You need at least one column"); }
  let to = if at > 0 { open[at - 1] } else if at == 0 { open[1] } else { others[0] };
  let moved = 0;
  for r in table("todo_user").where("user_id", me).where("stage_id", id).list() {
    table("todo_user").record(r.id).set(#{ stage_id: to.id }).flash();
    moved += 1;
  }
  table("stage").delete(id);
  #{ id: id, moved: moved, to: to.id, to_name: to.name_local }
