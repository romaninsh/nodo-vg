# yaml-language-server: $schema=./action-schema-1.json
# Star a to-do (Odoo's priority) or take the star off. Args: id.
kind: script
label: Star
icon: Star
params:
  id: { type: int }
body: |
  let id = parse_int(args.id.to_string());
  let t = table("todo").get(id);
  if t == () { fail("That to-do isn't yours"); }
  let starred = t.priority == "1";
  table("todo").record(id).set(#{ priority: if starred { "0" } else { "1" } }).flash();
  #{ id: id, starred: !starred }
