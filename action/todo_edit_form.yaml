# yaml-language-server: $schema=./action-schema-1.json
kind: form
label: Edit to-do
dialog:
  title: Edit to-do
  confirm_label: Save
  size: md
form:
  fields:
    - { name: name, type: string, label: Title }
    - { name: date_deadline, type: timestamp, label: Deadline, required: false, placeholder: "YYYY-MM-DD HH:MM (empty: no deadline)" }
    - { name: description, type: string, label: Description, multiline: true, required: false }
