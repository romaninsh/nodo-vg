# yaml-language-server: $schema=./action-schema-1.json
# Sign in with an Odoo login and password (checked against Odoo's own hash in res_users).
kind: script
label: Sign in
icon: User
params:
  login: { type: string, label: Login }
  password: { type: string, label: Password }
rate_limit: { per_second: 1, burst: 5 }
body: |
  let login = if args.login == () { "" } else { args.login.to_string() };
  login.trim();
  if login == "" || args.password == () { fail("Enter your login and password"); }
  let id = session.check_password(#{ login: login }, args.password, "password");
  if id == () { fail("Wrong login or password"); }
  let u = session.identity(id);
  if u.active != true || u.share == true { fail("This account can't use nodo"); }
  let p = table("person").get(id);
  let name = if p == () { login } else { p.name };
  let lang = if p == () || p.lang == () { "en_US" } else { p.lang };
  // The id as a number, so the rules compare Odoo's integer user_id with a number.
  let uid = parse_int(id.to_string());
  // A row in nodo's sign-in file (table/web_session.yaml); it ends 8 hours from now (the
  // column's default) and survives restarts. `uid` links the row to the person, filled from `id`.
  let token = session.create(id, #{ name: name, login: login, lang: lang });
  #{ token: token, uid: uid, name: name, login: login }
