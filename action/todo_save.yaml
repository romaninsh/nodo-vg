# yaml-language-server: $schema=./action-schema-1.json
# Save a to-do's fields. Args: id, and any of name, description, date_deadline (empty text
# clears it), priority ("0" Low, "1" Medium, "2" High, "3" Urgent), state.
kind: script
label: Save
icon: Save
params:
  id: { type: int }
  name: { type: string, required: false }
  description: { type: string, required: false }
  date_deadline: { type: string, required: false }
  priority: { type: string, required: false }
  state: { type: string, required: false }
body: |
  import "todo" as t;
  let id = parse_int(args.id.to_string());
  let me = session.uid;
  if table("todo_view").where("id", id).count() == 0
     || table("todo_user").where("task_id", id).where("user_id", me).count() == 0 {
    fail("That to-do isn't yours");
  }
  let p = #{};
  if "name" in args {
    let n = if args.name == () { "" } else { args.name.to_string() };
    n.trim();
    if n == "" { fail("Give the to-do a title"); }
    p.name = n;
  }
  if "description" in args { p.description = args.description; }
  if "date_deadline" in args { p.date_deadline = t::deadline(args.date_deadline); }
  if "priority" in args && args.priority != () {
    let level = args.priority.to_string();
    if !["0", "1", "2", "3"].contains(level) {
      fail("Priority must be 0 (Low), 1 (Medium), 2 (High) or 3 (Urgent)");
    }
    p.priority = level;
  }
  if "state" in args && args.state != () { p.state = args.state; }
  let before = table("todo").get(id);
  if p.len() > 0 { table("todo").record(id).set(p).flash(); }
  // Odoo's change history for the fields it tracks on a to-do.
  let changes = [];
  if "name" in p { changes.push([before.name, p.name, "Title"]); }
  if "priority" in p { changes.push([t::priority_label(before.priority), t::priority_label(p.priority), "Priority"]); }
  if "state" in p { changes.push([t::state_label(before.state), t::state_label(p.state), "State"]); }
  if "date_deadline" in p { changes.push([t::deadline_label(before.date_deadline), t::deadline_label(p.date_deadline), "Deadline"]); }
  let who = table("person").get(me);
  let m = t::tracking_message(id, t::tracking_body(changes), if who == () { () } else { who.partner_id },
    table("mail_subtype").get("mt_note")?.subtype_id, me);
  if m != () { table("message").insert(m); }
  #{ id: id }
