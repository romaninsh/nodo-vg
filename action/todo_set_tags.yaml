# yaml-language-server: $schema=./action-schema-1.json
# Replace a to-do's tags. Args: id (the to-do), tags (a list of tag ids, or "1,5" text).
# Odoo keeps tags as rows in project_tags_project_task_rel and tracks nothing else for them, so
# this writes those rows directly: links not in the list go, missing ones are added.
kind: script
label: Set tags
icon: Tag
params:
  id: { type: int }
  tags: { type: string, required: false }
body: |
  import "todo" as t;
  let id = parse_int(args.id.to_string());
  if !t::assigned(table("todo_view").get(id), session.uid) { fail("That to-do isn't yours"); }
  let wanted = t::ids(args.tags);
  let links = table("todo").where("id", id).ref("tags");
  let has = [];
  for l in links.list() {
    if wanted.contains(l.project_tags_id) { has.push(l.project_tags_id); } else { links.delete(l.id); }
  }
  for g in wanted { if !has.contains(g) { links.insert(#{ project_tags_id: g }); } }
  #{ id: id, tags: wanted.len() }
