# yaml-language-server: $schema=./action-schema-1.json
# Mark a to-do done, or open it again. Args: id.
kind: script
label: Mark as done
icon: CircleCheck
params:
  id: { type: int }
body: |
  import "todo" as t;
  let id = parse_int(args.id.to_string());
  if !t::assigned(table("todo_view").get(id), session.uid) { fail("That to-do isn't yours"); }
  let done = table("todo").get(id).state == "1_done";
  table("todo").record(id).set(#{ state: if done { "01_in_progress" } else { "1_done" } }).flash();
  #{ id: id, done: !done }
