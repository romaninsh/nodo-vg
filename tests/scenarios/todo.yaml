fixtures: todo-basics
vars:
  monicas: { record: todo, id: 900 }
  marc_cards: { vista: todo_user, where: { user_id: 5 } }
  monicas_tags: { vista: todo_tag, where: { project_task_id: 900 } }
  # Odoo's change history on Monica's to-do.
  history: { vista: message, where: { res_id: 900, message_type: tracking } }

scenarios:
  quick-add:
    session: { app: team, uid: 5, name: Marc Demo, login: demo, lang: en_US }
    clock: 2026-11-21T09:00:00Z
    steps:
      - step: Marc adds a to-do from the board
        do: { action: todo_create, args: { name: "Call the supplier" } }
        assert:
          - result.id != ()
          - marc_cards.count() == 1
          - marc_cards.first().stage_id == 12
        vars:
          added: { record: todo, from: result.id }
        what_if: [no-columns-yet, html-description, quick-add-keywords]
      - step: The new to-do is stamped the way Odoo stamps it
        assert:
          - added.state == "01_in_progress"
          - added.priority == "0"
          - added.create_uid == 5
          - added.project_id == ()

  no-columns-yet:
    steps:
      - step: Marc has no personal columns yet
        before: |
          set("stage", 12, #{ user_id: 99 });
          set("stage", 13, #{ user_id: 99 });
          set("stage_open", 12, #{ user_id: 99 });
          set("stage_open", 13, #{ user_id: 99 });
        fails: "You have no to-do columns yet"

  # Odoo's quick-add keywords at the end of a title. "#tag", "@person" and the column go through
  # actions that read the to-do's view or its assignments, which the in-memory copies don't have
  # for a new to-do; those were checked live.
  quick-add-keywords:
    steps:
      - step: 'Marc quick-adds "Order paper !!"'
        do: { action: todo_quick_add, args: { name: "Order paper !!" } }
        assert:
          - result.name == "Order paper"
        vars:
          paper: { record: todo, from: result.id }
      - step: The "!!" became a High priority
        assert:
          - paper.name == "Order paper"
          - paper.priority == "2"
      - step: Keywords in the middle of a title stay words
        do: { action: todo_quick_add, args: { name: "Fix #3 in the plan" } }
        assert:
          - 'result.name == "Fix #3 in the plan"'

  html-description:
    steps:
      - step: Marc adds a to-do whose description looks like HTML
        do: { action: todo_create, args: { name: "Check the link", description: "<img src=x onerror=alert(1)>" } }
        vars:
          html: { record: todo, from: result.id }
      - step: It is stored as text, so Odoo shows it instead of running it
        assert:
          - html.description == "<p>&lt;img src=x onerror=alert(1)&gt;</p>"

  # Odoo's four priority levels survive a round trip; done toggles Odoo's two states.
  monica-priority:
    session: { app: team, uid: 6, name: Monica Light, login: light, lang: en_US }
    clock: 2026-11-21T09:00:00Z
    steps:
      - step: Monica's Urgent to-do goes down to High
        do: { action: todo_set_priority, args: { id: 900, priority: "2" } }
        assert:
          - result.priority == "2"
          - monicas.priority == "2"
        what_if: [no-fifth-level, done-and-back, not-marcs, monica-tags]
      - step: And back up to Urgent
        do: { action: todo_set_priority, args: { id: 900, priority: "3" } }
        assert:
          - monicas.priority == "3"

  no-fifth-level:
    steps:
      - step: Monica asks for a level Odoo doesn't have
        do: { action: todo_set_priority, args: { id: 900, priority: "4" } }
        fails: "Priority must be 0 (Low), 1 (Medium), 2 (High) or 3 (Urgent)"
      - step: The to-do stays Urgent
        assert:
          - monicas.priority == "3"

  not-marcs:
    steps:
      - step: Marc tries to change the priority of Monica's to-do
        as: { app: team, uid: 5, name: Marc Demo, login: demo, lang: en_US }
        fails: "That to-do isn't yours"
      - step: Marc can't mark it done either
        as: { app: team, uid: 5, name: Marc Demo, login: demo, lang: en_US }
        do: { action: todo_toggle_done, args: { id: 900 } }
        fails: "That to-do isn't yours"
      - step: Nor tag it
        as: { app: team, uid: 5, name: Marc Demo, login: demo, lang: en_US }
        do: { action: todo_set_tags, args: { id: 900, tags: "1" } }
        fails: "That to-do isn't yours"
      - step: Nor copy it
        as: { app: team, uid: 5, name: Marc Demo, login: demo, lang: en_US }
        do: { action: todo_duplicate, args: { id: 900 } }
        fails: "That to-do isn't yours"
      - step: Nor delete it
        as: { app: team, uid: 5, name: Marc Demo, login: demo, lang: en_US }
        do: { action: todo_delete, args: { id: 900 } }
        fails: "That to-do isn't yours"
      - step: Nor log a note on it
        as: { app: team, uid: 5, name: Marc Demo, login: demo, lang: en_US }
        do: { action: todo_log_note, args: { id: 900, note: "mine" } }
        fails: "That to-do isn't yours"
      - step: Nor schedule an activity on it
        as: { app: team, uid: 5, name: Marc Demo, login: demo, lang: en_US }
        do: { action: todo_schedule_activity, args: { id: 900, type: 2 } }
        fails: "That to-do isn't yours"
      - step: Nor colour its card
        as: { app: team, uid: 5, name: Marc Demo, login: demo, lang: en_US }
        do: { action: todo_set_color, args: { id: 900, color: 3 } }
        fails: "That to-do isn't yours"
      - step: Nor add himself as a follower
        as: { app: team, uid: 5, name: Marc Demo, login: demo, lang: en_US }
        do: { action: todo_follow, args: { id: 900, person: 5 } }
        fails: "That to-do isn't yours"
      - step: Monica logs a note on her own to-do, escaped into a paragraph
        do: { action: todo_log_note, args: { id: 900, note: "Ask <Ana> & co." } }
        vars:
          her_note: { record: message, from: result.id }
      - step: It is stored as Odoo stores a note
        assert:
          - her_note.body == "<p>Ask &lt;Ana&gt; &amp; co.</p>"
          - her_note.message_type == "comment"
          - her_note.is_internal == true
      - step: It is still there
        assert:
          - monicas.name == "Monica's own to-do"

  # Tags are rows in Odoo's link table, written directly: links not in the list go, missing
  # ones are added, and a tag kept is the same row.
  monica-tags:
    steps:
      - step: Monica tags her to-do Bug and New Feature
        do: { action: todo_set_tags, args: { id: 900, tags: "1,2" } }
        assert:
          - monicas_tags.count() == 2
        vars:
          feature_link: { vista: todo_tag, where: { project_task_id: 900, project_tags_id: 2 } }
      - step: She swaps Bug for Experiment; New Feature stays
        do: { action: todo_set_tags, args: { id: 900, tags: "2,3" } }
        assert:
          - monicas_tags.count() == 2
          - monicas_tags.list().map(|l| l.project_tags_id).contains(3)
          - "!monicas_tags.list().map(|l| l.project_tags_id).contains(1)"
          - feature_link.count() == 1
      - step: She clears them
        do: { action: todo_set_tags, args: { id: 900, tags: "" } }
        assert:
          - monicas_tags.count() == 0

  done-and-back:
    steps:
      - step: Monica marks the to-do done
        do: { action: todo_toggle_done, args: { id: 900 } }
        assert:
          - result.done == true
          - monicas.state == "1_done"
          - monicas.date_end != ()
          - monicas.priority == "3"
          - history.count() == 1
          - 'history.first().body == "<div>In Progress → <b>Done</b> <i>(State)</i>\n</div>"'
      - step: She opens it again
        do: { action: todo_toggle_done, args: { id: 900 } }
        assert:
          - result.done == false
          - monicas.state == "01_in_progress"
          - monicas.date_end == ()

  columns-stay-private:
    session: { app: team, uid: 5, name: Marc Demo, login: demo, lang: en_US }
    steps:
      - step: Marc tries to put a card into Monica's column
        do: { action: todo_move, args: { id: 900, stage: 27 } }
        fails: "That column isn't yours"
      - step: He can't rename Monica's Inbox
        do: { action: stage_rename, args: { id: 27, name: "Mine" } }
        fails: "That column isn't yours"
      - step: Nor fold it
        do: { action: stage_fold, args: { id: 27 } }
        fails: "That column isn't yours"
      - step: Nor delete it
        do: { action: stage_delete, args: { id: 27 } }
        fails: "That column isn't yours"
      - step: Nor slip it into his own order
        do: { action: stage_reorder, args: { ids: "12,27,13" } }
        fails: "That column isn't yours"
      # Deleting a column moves the assignments in it first; assignments read through the
      # rule's SQL condition, which the in-memory copies can't run, so that was checked live
      # (a project task's assignment moved to the previous column, then the column went).

  # The to-do and assignment rules narrow with SQL (`with_condition`), which the in-memory test
  # copies can't evaluate ("native condition isn't this table's condition type"). These
  # refusals were checked on the live app instead (NOTES.md).
  others-stay-private:
    skip: the rules' SQL conditions don't run on in-memory test tables; checked live
    session: { app: team, uid: 5, name: Marc Demo, login: demo, lang: en_US }
    steps:
      - step: Marc tries to move Monica's to-do
        do: { action: todo_move, args: { id: 900, stage: 13 } }
        fails: "That to-do isn't yours"
      - step: Marc tries to give himself Monica's to-do directly
        do: |
          table("todo_user").insert(#{ task_id: 900, user_id: 5, stage_id: 12 });
        fails: "Assignments are made by adding or assigning a to-do"
      - step: Marc tries to rename Monica's to-do
        do: { action: todo_save, args: { id: 900, name: "mine now" } }
        fails: "That to-do isn't yours"
