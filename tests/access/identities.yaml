# Odoo's demo people, with the session fields sign-in gives them (action/sign_in.yaml).
# `fields:`, because nodo keeps no session table that a `from:` identity could link.
people:
  marc:   { fields: { uid: 5, name: Marc Demo, login: demo, lang: en_US } }
  monica: { fields: { uid: 6, name: Monica Light, login: light, lang: en_US } }
