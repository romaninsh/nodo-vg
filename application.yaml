app: nodo
theme:
  light: Catppuccin Latte
  dark: Catppuccin Frappe
layout: nodo
home: board

# Rules narrow the desktop too: it always shows exactly what one person sees. The desktop is
# Mitchell Admin's; the title bar's name menu switches to another person (session.assume).
desktop_full_access: false

session:
  # Web sign-ins are rows in nodo's own SQLite file (datasource/sessions.yaml, built by
  # ingress.sh), never in Odoo's database, so app and server restarts keep everyone signed in.
  table: web_session
  identity: odoo_user                         # Odoo's res_users
  password_schemes: [pbkdf2_sha512, argon2id] # Odoo's passlib hashes
  # A sign-in ends 8 hours after it began (its row's expires_at, never empty: NOT NULL with a
  # default); an archived or portal user is signed out at once. Sessions without a row (the
  # desktop's, an assumed one, an access test's or an MCP view's) have no expiry to check.
  valid: >-
    (identity == () || (identity.active == true && identity.share != true))
    && (session.assumed || session.expires_at == () || session.expires_at > now())
  fields:
    uid: {}
    name: {}
    login: {}
    lang: {}                                  # "de_DE": the person's Odoo language (res_partner.lang)
  signed_out: [sign_in]
  desktop: '#{ uid: 2, name: "Mitchell Admin", login: "admin", lang: "en_US" }'

# The local Odoo container (datasource/odoo.yaml). Access tests run on it, reverting every write.
profiles:
  local: {}
